<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="description" content="Descripción de tu página web">
    <!-- Enlace a archivos CSS o fuentes -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Contenido de tu página web -->
<header>
    <h1>Mi página web</h1>
    <nav>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Acerca de</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>
</header>

<main>
    <section id="login-section">
        <h2>Login</h2>
        <form id="loginForm">
            <div>
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Iniciar sesión</button>
        </form>
        <div id="message"></div>
    </section>

    <section id="protected-content" style="display: none;">
        <h2>Contenido protegido</h2>
        <p>¡Bienvenido! Has iniciado sesión correctamente.</p>
        <button id="logoutBtn">Cerrar sesión</button>
    </section>
</main>

<footer>
    <p>Derechos reservados &copy; 2023</p>
</footer>

<!-- Enlace a archivos JavaScript -->
<!--<script src="script.js"></script>-->
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('http://localhost:8080/jwtApp/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('jwtToken', data.token);

            // Agregar token a las peticiones futuras
            fetch('http://localhost:8080/jwtApp/api/protected', {
                headers: {
                    'Authorization': `Bearer ${data.token}`
                }
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('message').textContent = 'Acceso exitoso';
            });
        } else {
            document.getElementById('message').textContent = 'Credenciales incorrectas';
        }
    } catch (error) {
        console.error('Error:', error);
        document.getElementById('message').textContent = 'Error al conectar con el servidor';
    }
});
</script>

</body>
</html>
